name: CI
on:
  pull_request:
  push:
    branches: [master, 'feature/**', 'fix/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - name: Readability size review
        continue-on-error: true
        run: python3 scripts/review_size.py
      - run: npm run test:docs
      - run: npm run test:catalog
      - run: npm run test:contract
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run test:deployment
      - run: npm run test:release
  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Repeat high-risk input transition regressions
        run: npm run test:e2e:interaction-regression

  fullstack-hint-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: arturognailuy/sudoku
          ref: 4e51678e457db9ef3a8e1630e6d194de0dbfe3d0
          path: backend
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:fullstack
        env:
          SUDOKU_BACKEND_REPO: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fullstack-hint-screenshots
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 14

  trusted-release:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [quality, browser-e2e, fullstack-hint-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUDOKU_MOUNT_PATH: ${{ vars.SUDOKU_MOUNT_PATH || '/' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build selected portable mount
        run: npm run build
      - name: Package and verify trusted artifact
        run: |
          node scripts/package-release.mjs create \
            --dist dist \
            --output build/release \
            --repository "$GITHUB_REPOSITORY" \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            --commit "$GITHUB_SHA" \
            --mount "$SUDOKU_MOUNT_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: sudoku-frontend-${{ github.sha }}
          path: build/release/
          if-no-files-found: error
          retention-days: 30
